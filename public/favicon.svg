<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Emerald Glow -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Android Droid Antennas (Top Brand Accent) -->
  <g opacity="0.95">
    <line x1="180" y1="36" x2="140" y2="6" stroke="url(#emerald-grad)" stroke-width="20" stroke-linecap="round" />
    <line x1="332" y1="36" x2="372" y2="6" stroke="url(#emerald-grad)" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Main Squircle Card Container -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="96"
    fill="url(#bg-grad)"
    stroke="url(#border-grad)"
    stroke-width="10"
  />

  <!-- Inner Subtle Accent Ring -->
  <rect
    x="44"
    y="44"
    width="424"
    height="424"
    rx="84"
    fill="none"
    stroke="#10b981"
    stroke-width="2"
    stroke-opacity="0.2"
  />

  <!-- Core Icon Graphics -->
  <g>
    <!-- Terminal Chevron '>' in Glowing Emerald -->
    <path
      d="M 108 176 L 188 256 L 108 336"
      fill="none"
      stroke="url(#emerald-grad)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#emerald-glow)"
    />

    <!-- Geometric 'G' Monogram in Crisp White -->
    <path
      d="M 370 198 A 75 75 0 1 0 370 314 L 370 256 L 305 256"
      fill="none"
      stroke="#ffffff"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Terminal Cursor Underscore '_' in Emerald -->
    <line
      x1="265"
      y1="385"
      x2="370"
      y2="385"
      stroke="url(#emerald-grad)"
      stroke-width="34"
      stroke-linecap="round"
      filter="url(#emerald-glow)"
    />
  </g>
</svg>
